name: wallet-mono

services:
  app:
    image: wallet-mono:${WALLET_RELEASE_TAG:?Set a unique WALLET_RELEASE_TAG for this release}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    expose:
      - "3000"
    networks:
      gateway:
        aliases:
          - wallet-mono-app
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/mono').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  gateway:
    external: true
    name: dlc-dm_default

